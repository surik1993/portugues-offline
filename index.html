<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#146b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PT Словарь">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Португальский офлайн</title>
</head>
<body>
<header><div class="brand">🇵🇹 <span>Português</span></div><div class="sub">Европейский португальский · офлайн</div></header>
<nav class="tabs" aria-label="Разделы">
<button class="tab active" data-view="search">Словарь</button>
<button class="tab" data-view="favorites">Избранное <span id="favCount">0</span></button>
<button class="tab" data-view="cards">Карточки</button>
</nav>
<main>
<section id="searchView" class="view">
<label class="searchbox"><span>⌕</span><input id="query" type="search" placeholder="Португальское слово или перевод…" autocomplete="off"></label>
<p id="resultMeta" class="muted"></p>
<div id="results" class="results"></div>
</section>
<section id="favoritesView" class="view hidden"><h2>Избранное</h2><div id="favoritesList" class="results"></div></section>
<section id="cardsView" class="view hidden">
<div class="card-head"><div><p class="eyebrow">ТРЕНИРОВКА</p><h2>Запомни слово</h2></div><span id="cardProgress" class="pill"></span></div>
<div id="flashcard" class="flashcard">
<p class="muted">Португальское слово</p><div id="flashWord" class="flash-word">—</div>
<div id="flashAnswer" class="answer hidden"></div>
<button id="showAnswer" class="primary">Показать перевод</button>
<div id="cardActions" class="card-actions hidden"><button id="forgot" class="secondary">Повторить позже</button><button id="learned" class="primary">Знаю</button></div>
</div>
<div class="card-nav"><button id="prevCard" class="secondary">← Назад</button><button id="nextCard" class="secondary">Далее →</button></div>
<p class="muted small">Прогресс сохраняется на этом устройстве.</p>
</section>
</main>
<footer><span id="offlineStatus">Локальный словарь</span><span id="wordCount">Загрузка…</span></footer>
<dialog id="entryDialog"><button class="close" id="closeDialog" aria-label="Закрыть">×</button><div id="entryDetail"></div></dialog>
<script src="app.js"></script>
</body>
</html>
